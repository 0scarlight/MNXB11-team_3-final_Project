<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180" role="img" aria-labelledby="title desc">
  <title id="title">Coarse Cleaning in the SMHI workflow</title>
  <desc id="desc">Raw SMHI observations enter the red Coarse Cleaning stage, which checks format, chronological order, temperature change rate and temperature range. The output is cleaned CSV files.</desc>
  <rect width="800" height="180" rx="12" fill="#f8fafc"/>
  <g fill="#fff" stroke="#94a3b8" stroke-width="1.5">
    <rect x="20" y="62" width="176" height="56" rx="8"/>
    <rect x="604" y="62" width="176" height="56" rx="8"/>
  </g>
  <rect x="231" y="22" width="338" height="136" rx="10" fill="#fff1f2" stroke="#b91c1c" stroke-width="3"/>
  <path d="M200 90h25m-8-6 8 6-8 6m357-6h25m-8-6 8 6-8 6" fill="none" stroke="#475569" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" fill="#0f172a">
    <text x="108" y="95">Raw SMHI observations</text>
    <text x="692" y="95">Cleaned CSV files</text>
    <text x="400" y="53" fill="#991b1b" font-size="20" font-weight="700">Coarse Cleaning</text>
    <text x="400" y="78">Data format</text>
    <text x="400" y="99">Chronological order</text>
    <text x="400" y="120">Temperature change rate</text>
    <text x="400" y="141">Temperature range</text>
  </g>
</svg>
